<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交通フロー</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#101419;color:#edf2f7;font-family:Arial,"Noto Sans JP",sans-serif}
header{padding:16px 18px;background:#171e26;border-bottom:1px solid #303b47}
h1{font-size:22px;margin:0 0 5px}
header p{margin:0;color:#aeb9c5;font-size:13px}
main{max-width:1100px;margin:auto;padding:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:1px solid #485666;background:#202a35;color:#edf2f7;border-radius:8px;padding:10px 13px;font-size:14px;cursor:pointer}
button.active{background:#176b9c;border-color:#4bb5f0}
button:hover{filter:brightness(1.15)}
.status{font-size:13px;color:#cfe3f2;background:#19212a;border:1px solid #303b47;border-radius:9px;padding:9px 12px;margin-bottom:12px}
.status.ok{color:#8be0b0;border-color:#2f6b4c}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:#19212a;border:1px solid #303b47;border-radius:9px;padding:10px}
.stat span{display:block;font-size:12px;color:#aeb9c5;margin-bottom:5px}
.stat strong{font-size:20px}
.canvas-wrap{position:relative;background:#18231f;border:1px solid #394a40;border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.hint{font-size:12px;line-height:1.7;color:#aeb9c5;margin:10px 2px}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:#c6d0da;margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
@media(max-width:600px){main{padding:9px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}button{flex:1}.stat strong{font-size:18px}h1{font-size:20px}}
</style>
</head>
<body>
<header>
<h1>交通フロー</h1>
<p>道路をつなぎ、車を安全にゴールへ導こう。</p>
</header>
<main>
<div class="toolbar">
<button id="straight" class="active">直線道路</button>
<button id="freehand">フリーハンド</button>
<button id="undo">道路を1本戻す</button>
<button id="reset">リセット</button>
</div>
<div id="status" class="status">スタートからゴールまで道路をつなぐと、自動で車が走り出します</div>
<div class="stats">
<div class="stat"><span>走行中の車</span><strong id="moving">0</strong></div>
<div class="stat"><span>ゴール到着</span><strong id="arrived">0</strong></div>
<div class="stat"><span>平均速度</span><strong id="speed">0</strong></div>
<div class="stat"><span>渋滞区間</span><strong id="traffic">0</strong></div>
</div>
<div class="canvas-wrap">
<canvas id="game" width="1000" height="600"></canvas>
</div>
<div class="legend">
<span><i class="dot" style="background:#626c76"></i>通常</span>
<span><i class="dot" style="background:#f2a23a"></i>混雑</span>
<span><i class="dot" style="background:#e94c4c"></i>渋滞</span>
<span><i class="dot" style="background:#3ddc84"></i>青信号</span>
<span><i class="dot" style="background:#ff4d4d"></i>赤信号</span>
<span>● スタート　 ◆ 中間地点　 ● ゴール</span>
</div>
<p class="hint">直線道路は2か所をタップして作成。フリーハンドはドラッグして描画。道路が交差・接続した場所は交差点になり、信号が付きます。スタートからゴールまで道路がつながると自動で運転が始まります。中間地点はリセット時にランダムで配置されます。</p>
</main>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=1000,H=600;
const $=id=>document.getElementById(id);
let roads=[],cars=[],nodes=[],edges=[],mode="straight";
let firstPoint=null,stroke=[],drawing=false,lastTime=0,spawnTimer=0,arrived=0;
let connected=false,clock=0;
let mid={x:500,y:180};
const START={x:55,y:300};
const GOAL={x:945,y:300};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;

function randomMid(){
  mid={x:280+Math.random()*440,y:100+Math.random()*400};
  if(Math.abs(mid.y-START.y)<75)mid.y=mid.y<300?mid.y-80:mid.y+80;
  mid.x=clamp(mid.x,230,770);
  mid.y=clamp(mid.y,75,525);
}

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  if(!rect.width)return;
  const dpr=window.devicePixelRatio||1;
  const pw=Math.round(rect.width*dpr);
  const ph=Math.round(pw*H/W);
  if(canvas.width!==pw||canvas.height!==ph){
    canvas.width=pw;
    canvas.height=ph;
  }
  const scale=pw/W;
  ctx.setTransform(scale,0,0,scale,0,0);
  draw();
}

function screenPoint(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:clamp((e.clientX-r.left)*W/r.width,0,W),
    y:clamp((e.clientY-r.top)*H/r.height,0,H)
  };
}
function pointSegment(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const len=dx*dx+dy*dy;
  const t=len?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/len,0,1):0;
  const q={x:a.x+dx*t,y:a.y+dy*t};
  return {point:q,t,d:dist(p,q)};
}
function intersection(a,b,c,d){
  const den=(a.x-b.x)*(c.y-d.y)-(a.y-b.y)*(c.x-d.x);
  if(Math.abs(den)<0.0001)return null;
  const t=((a.x-c.x)*(c.y-d.y)-(a.y-c.y)*(c.x-d.x))/den;
  const u=-((a.x-b.x)*(a.y-c.y)-(a.y-b.y)*(a.x-c.x))/den;
  if(t<0.001||t>0.999||u<0.001||u>0.999)return null;
  return {x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y),t,u};
}
function snapPoint(p){
  let best=p,bestD=18;
  for(const n of nodes){
    const d=dist(p,n);
    if(d<bestD){bestD=d;best=n}
  }
  for(const road of roads){
    for(let i=0;i<road.length-1;i++){
      const q=pointSegment(p,road[i],road[i+1]);
      if(q.d<bestD){bestD=q.d;best=q.point}
    }
  }
  return {x:best.x,y:best.y};
}
function addRoad(points){
  if(points.length<2)return;
  const cleaned=[points[0]];
  for(let i=1;i<points.length;i++){
    if(dist(cleaned[cleaned.length-1],points[i])>5)cleaned.push(points[i]);
  }
  if(cleaned.length<2)return;
  cleaned[0]=snapPoint(cleaned[0]);
  cleaned[cleaned.length-1]=snapPoint(cleaned[cleaned.length-1]);
  roads.push(cleaned);
  cars=[];
  rebuildGraph();
  draw();
}
function smoothStroke(points){
  if(points.length<3)return points;
  const spaced=[points[0]];
  for(let i=1;i<points.length;i++){
    const a=spaced[spaced.length-1],b=points[i];
    const d=dist(a,b);
    const count=Math.ceil(d/5);
    for(let j=1;j<=count;j++){
      const t=j/count;
      spaced.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)});
    }
  }
  let smoothed=spaced;
  for(let pass=0;pass<2;pass++){
    const out=[smoothed[0]];
    for(let i=1;i<smoothed.length-1;i++){
      out.push({
        x:smoothed[i-1].x*.25+smoothed[i].x*.5+smoothed[i+1].x*.25,
        y:smoothed[i-1].y*.25+smoothed[i].y*.5+smoothed[i+1].y*.25
      });
    }
    out.push(smoothed[smoothed.length-1]);
    smoothed=out;
  }
  const simplified=[smoothed[0]];
  let anchor=smoothed[0];
  for(let i=1;i<smoothed.length-1;i++){
    if(pointSegment(smoothed[i],anchor,smoothed[i+1]).d>1.8){
      simplified.push(smoothed[i]);
      anchor=smoothed[i];
    }
  }
  simplified.push(smoothed[smoothed.length-1]);
  return simplified;
}

function signalGroup(node,from){
  const ang=Math.atan2(from.y-node.y,from.x-node.x);
  let d=Math.abs(ang-node.ref)%Math.PI;
  if(d>Math.PI/2)d=Math.PI-d;
  return d<Math.PI/4?0:1;
}
function isGreen(node,group){
  if(!node.hasG[0]||!node.hasG[1])return true;
  const p=(clock+node.offset)%8;
  if(group===0)return p<3.5;
  return p>=4&&p<7.5;
}

function rebuildGraph(){
  nodes=[];edges=[];
  const segments=[];
  for(let ri=0;ri<roads.length;ri++){
    const r=roads[ri];
    for(let i=0;i<r.length-1;i++){
      if(dist(r[i],r[i+1])>3)segments.push({a:r[i],b:r[i+1],cuts:[{t:0,p:r[i]},{t:1,p:r[i+1]}],ri,i});
    }
  }
  for(let i=0;i<segments.length;i++){
    for(let j=i+1;j<segments.length;j++){
      const a=segments[i],b=segments[j];
      if(a.ri===b.ri&&Math.abs(a.i-b.i)<=1)continue;
      const hit=intersection(a.a,a.b,b.a,b.b);
      if(hit){
        a.cuts.push({t:hit.t,p:hit});
        b.cuts.push({t:hit.u,p:hit});
      }
    }
  }
  for(let i=0;i<segments.length;i++){
    const a=segments[i];
    for(let j=0;j<segments.length;j++){
      if(i===j)continue;
      const b=segments[j];
      if(a.ri===b.ri&&Math.abs(a.i-b.i)<=1)continue;
      for(const end of [{t:0,p:a.a},{t:1,p:a.b}]){
        const q=pointSegment(end.p,b.a,b.b);
        if(q.d<15&&q.t>.02&&q.t<.98){
          a.cuts.push(end);
          b.cuts.push({t:q.t,p:end.p});
        }
      }
    }
  }
  function getNode(p){
    let n=nodes.find(v=>dist(v,p)<5);
    if(!n){n={x:p.x,y:p.y,id:nodes.length,links:[]};nodes.push(n)}
    return n;
  }
  for(const s of segments){
    s.cuts.sort((a,b)=>a.t-b.t);
    const unique=[];
    for(const c of s.cuts){
      if(!unique.length||Math.abs(c.t-unique[unique.length-1].t)>.002)unique.push(c);
    }
    for(let i=0;i<unique.length-1;i++){
      const a=getNode(unique[i].p),b=getNode(unique[i+1].p);
      if(a===b)continue;
      const length=dist(a,b);
      if(length<3)continue;
      const edge={a,b,length,cars:0};
      edges.push(edge);
      a.links.push({node:b,edge});
      b.links.push({node:a,edge});
    }
  }
  for(const n of nodes){
    n.signal=n.links.length>=3;
    if(n.signal){
      n.ref=Math.atan2(n.links[0].node.y-n.y,n.links[0].node.x-n.x);
      n.offset=(n.x*.37+n.y*.61)%8;
      n.hasG=[false,false];
      for(const l of n.links)n.hasG[signalGroup(n,l.node)]=true;
    }
  }
  connected=!!routeForCar();
  spawnTimer=2.7;
  updateStatus();
}
function updateStatus(){
  const s=$("status");
  if(connected){
    s.textContent="運行中：スタートとゴールがつながっています";
    s.className="status ok";
  }else{
    s.textContent="スタートからゴールまで道路をつなぐと、自動で車が走り出します";
    s.className="status";
  }
}
function closestNode(p,max=35){
  let best=null,d0=max;
  for(const n of nodes){
    const d=dist(n,p);
    if(d<d0){d0=d;best=n}
  }
  return best;
}
function shortestPath(from,to){
  if(!from||!to)return null;
  const costs=new Map([[from,0]]),prev=new Map(),open=[from],visited=new Set();
  while(open.length){
    open.sort((a,b)=>costs.get(a)-costs.get(b));
    const n=open.shift();
    if(visited.has(n))continue;
    visited.add(n);
    if(n===to)break;
    for(const link of n.links){
      const e=link.edge;
      const traffic=e.cars||0;
      const next=costs.get(n)+e.length*(1+traffic*.45);
      if(next<(costs.get(link.node)??Infinity)){
        costs.set(link.node,next);
        prev.set(link.node,{node:n,edge:e});
        open.push(link.node);
      }
    }
  }
  if(!costs.has(to))return null;
  const path=[];
  let n=to;
  while(n!==from){
    const p=prev.get(n);
    if(!p)return null;
    path.unshift({edge:p.edge,from:p.node,to:n});
    n=p.node;
  }
  return path;
}
function routeForCar(){
  const s=closestNode(START,45),g=closestNode(GOAL,45);
  if(!s||!g)return null;
  const full=shortestPath(s,g);
  if(!full)return null;
  const m=closestNode(mid,50);
  if(!m)return full;
  const a=shortestPath(s,m),b=shortestPath(m,g);
  return a&&b?[...a,...b]:full;
}
function spawnCar(){
  const route=routeForCar();
  if(!route||!route.length)return;
  cars.push({
    path:route,index:0,t:0,speed:48+Math.random()*14,
    lane:Math.random()<.5?-1:1,color:["#e7f0f7","#e8b45d","#79b8ee","#e67c78","#b7a1ed"][Math.floor(Math.random()*5)]
  });
}
function edgeTraffic(){
  for(const e of edges)e.cars=0;
  for(const c of cars){
    const step=c.path[c.index];
    if(step)step.edge.cars++;
  }
}
function update(dt){
  clock+=dt;
  if(!connected)return;
  spawnTimer+=dt;
  if(spawnTimer>=2.7&&cars.length<14){
    spawnTimer=0;
    spawnCar();
  }
  edgeTraffic();
  for(const c of cars){
    const step=c.path[c.index];
    if(!step)continue;
    const edge=step.edge;
    let speed=c.speed;
    const traffic=edge.cars;
    if(traffic>=2)speed*=.72;
    if(traffic>=4)speed*=.45;
    const gap=Math.min(18/edge.length,.4);
    let limit=Infinity;
    for(const other of cars){
      if(other===c)continue;
      const os=other.path[other.index];
      if(!os||os.edge!==edge||os.from!==step.from)continue;
      const delta=other.t-c.t;
      if(delta>0&&delta<.2){
        speed*=Math.max(.15,delta/.2);
        limit=Math.min(limit,Math.max(c.t,other.t-gap));
      }
    }
    let nextT=c.t+speed*dt/edge.length;
    const node=step.to;
    if(node.signal&&!isGreen(node,signalGroup(node,step.from))){
      const stopT=1-Math.min(26,edge.length*.4)/edge.length;
      if(c.t<=stopT)nextT=Math.min(nextT,stopT);
    }
    c.t=Math.min(nextT,limit);
    if(c.t>=1){
      c.index++;
      c.t=0;
      if(c.index>=c.path.length){
        c.done=true;
        arrived++;
      }
    }
  }
  cars=cars.filter(c=>!c.done);
  edgeTraffic();
  $("moving").textContent=cars.length;
  $("arrived").textContent=arrived;
  $("speed").textContent=cars.length?Math.round(cars.reduce((s,c)=>s+c.speed,0)/cars.length):0;
  $("traffic").textContent=edges.filter(e=>e.cars>=2).length;
}
function carPosition(c){
  const s=c.path[c.index];
  if(!s)return null;
  const a=s.from,b=s.to;
  const x=lerp(a.x,b.x,c.t),y=lerp(a.y,b.y,c.t);
  const angle=Math.atan2(b.y-a.y,b.x-a.x);
  const offset=c.lane*4;
  return {x:x-Math.sin(angle)*offset,y:y+Math.cos(angle)*offset,angle};
}
function drawGrid(){
  ctx.fillStyle="#18231f";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#26372e";ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function drawRoads(){
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.strokeStyle="#101419";ctx.lineWidth=35;
  for(const e of edges){
    ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();
  }
  ctx.fillStyle="#101419";
  for(const n of nodes){
    if(n.signal){ctx.beginPath();ctx.arc(n.x,n.y,18,0,Math.PI*2);ctx.fill()}
  }
  ctx.lineWidth=29;
  for(const e of edges){
    ctx.strokeStyle=e.cars>=4?"#e94c4c":e.cars>=2?"#f2a23a":"#626c76";
    ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();
  }
  ctx.lineCap="butt";
  ctx.strokeStyle="#d4d8d8";ctx.lineWidth=1.4;ctx.setLineDash([10,10]);
  for(const e of edges){
    ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.fillStyle="#626c76";
  for(const n of nodes){
    if(n.signal){ctx.beginPath();ctx.arc(n.x,n.y,15.5,0,Math.PI*2);ctx.fill()}
  }
}
function drawSignals(){
  for(const n of nodes){
    if(!n.signal)continue;
    for(const l of n.links){
      const d=dist(n,l.node);
      if(!d)continue;
      const ux=(l.node.x-n.x)/d,uy=(l.node.y-n.y)/d;
      const px=n.x+ux*27-uy*11,py=n.y+uy*27+ux*11;
      const green=isGreen(n,signalGroup(n,l.node));
      ctx.fillStyle=green?"#3ddc84":"#ff4d4d";
      ctx.strokeStyle="#101419";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fill();ctx.stroke();
    }
  }
}
function drawMarker(p,label,color,shape="circle"){
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle=color;ctx.strokeStyle="#ffffff";ctx.lineWidth=2;
  ctx.beginPath();
  if(shape==="diamond"){ctx.moveTo(0,-13);ctx.lineTo(13,0);ctx.lineTo(0,13);ctx.lineTo(-13,0);ctx.closePath()}
  else ctx.arc(0,0,12,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  ctx.fillStyle="#fff";ctx.font='bold 13px "Noto Sans JP",Arial,sans-serif';ctx.textAlign="center";
  ctx.fillText(label,0,-21);
  ctx.restore();
}
function drawCar(c){
  const p=carPosition(c);
  if(!p)return;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
  ctx.fillStyle="#0b0f13";ctx.fillRect(-10,-7,22,16);
  ctx.fillStyle=c.color;ctx.fillRect(-11,-6,22,12);
  ctx.fillStyle="#263d4d";ctx.fillRect(1,-4,6,8);
  ctx.fillStyle="#f8e6a0";ctx.fillRect(8,-4,2,3);ctx.fillRect(8,1,2,3);
  ctx.restore();
}
function draw(){
  drawGrid();
  drawRoads();
  drawSignals();
  for(const c of cars)drawCar(c);
  drawMarker(START,"スタート","#299e72");
  drawMarker(mid,"中間","#d59b30","diamond");
  drawMarker(GOAL,"ゴール","#347fdb");
  if(firstPoint){
    ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(firstPoint.x,firstPoint.y,7,0,Math.PI*2);ctx.stroke();
  }
  if(drawing&&stroke.length>1){
    ctx.strokeStyle="#d9f0ff";ctx.lineWidth=3;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(stroke[0].x,stroke[0].y);
    for(let i=1;i<stroke.length;i++)ctx.lineTo(stroke[i].x,stroke[i].y);
    ctx.stroke();ctx.setLineDash([]);
  }
}
canvas.addEventListener("pointerdown",e=>{
  const p=screenPoint(e);
  if(mode==="freehand"){
    drawing=true;stroke=[p];canvas.setPointerCapture(e.pointerId);draw();return;
  }
  if(!firstPoint){firstPoint=snapPoint(p);draw();return}
  const end=snapPoint(p);
  if(dist(firstPoint,end)>12)addRoad([firstPoint,end]);
  firstPoint=null;draw();
});
canvas.addEventListener("pointermove",e=>{
  if(!drawing)return;
  const p=screenPoint(e);
  if(dist(stroke[stroke.length-1],p)>3)stroke.push(p);
  draw();
});
function finishStroke(){
  if(!drawing)return;
  drawing=false;
  const result=smoothStroke(stroke);
  stroke=[];
  if(result.length>1)addRoad(result);
  draw();
}
canvas.addEventListener("pointerup",finishStroke);
canvas.addEventListener("pointercancel",finishStroke);

$("straight").onclick=()=>{
  mode="straight";firstPoint=null;
  $("straight").classList.add("active");$("freehand").classList.remove("active");
  draw();
};
$("freehand").onclick=()=>{
  mode="freehand";firstPoint=null;
  $("freehand").classList.add("active");$("straight").classList.remove("active");
  draw();
};
$("undo").onclick=()=>{
  roads.pop();cars=[];rebuildGraph();draw();
};
$("reset").onclick=()=>{
  roads=[];cars=[];nodes=[];edges=[];arrived=0;spawnTimer=0;
  firstPoint=null;stroke=[];drawing=false;randomMid();
  $("moving").textContent="0";$("arrived").textContent="0";
  $("speed").textContent="0";$("traffic").textContent="0";
  rebuildGraph();draw();
};

function loop(t){
  const dt=Math.min((t-lastTime)/1000||0,.05);
  lastTime=t;
  update(dt);draw();
  requestAnimationFrame(loop);
}
randomMid();
rebuildGraph();
resizeCanvas();
new ResizeObserver(resizeCanvas).observe(canvas);
window.addEventListener("resize",resizeCanvas);
requestAnimationFrame(loop);
</script>
</body>
</html>
