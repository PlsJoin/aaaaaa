
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffic Flow</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#18212a;color:#f4f7fa;font-family:Arial,"Noto Sans JP",sans-serif}
header{padding:13px 16px;background:#222d38}
h1{font-size:21px;margin:0 0 4px}
header p{margin:0;color:#aebdca;font-size:12px}
#toolbar,#stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#202a34}
#stats{background:#19232d;gap:16px;font-size:12px}
#stats b{color:#8fd1ff}
button{border:1px solid #506170;background:#303e4b;color:white;border-radius:7px;padding:10px 13px;font-size:13px;cursor:pointer}
button.active{background:#187dc1;border-color:#6bc2ff}
#notice{padding:8px 14px;color:#bdcbd7;font-size:12px}
#stage{height:calc(100dvh - 185px);min-height:360px}
canvas{display:block;width:100%;height:100%;touch-action:none}
@media(max-width:600px){
#toolbar{gap:6px;padding:8px}
button{padding:9px;font-size:12px}
#stats{gap:10px;padding:9px}
#stage{height:calc(100dvh - 220px)}
}
</style>
</head>
<body>
<header>
<h1>Traffic Flow</h1>
<p>道路を建設し、STARTからGOALへの交通網を完成させよう。</p>
</header>
<div id="toolbar">
<button id="build" class="active">＋ 道路を建設</button>
<button id="normal">通常操作</button>
<button id="reset">やり直す</button>
</div>
<div id="stats">
<div>走行中 <b id="count">0</b> 台</div>
<div>平均速度 <b id="speed">0</b> km/h</div>
<div>混雑区間 <b id="traffic">0</b></div>
<div>建設費 <b id="cost">0</b></div>
</div>
<div id="notice">道路を建設して START と GOAL をつなごう。車は約3秒ごとに出発する。</div>
<div id="stage"><canvas id="map"></canvas></div>
<script>
const canvas=document.querySelector("#map");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,D=1,roads=[],nodes=[],edges=[],cars=[];
let mode="build",drawing=false,p0=null,p1=null,last=0,spawn=0,cost=0;
const START={x:.055,y:.5},GOAL={x:.945,y:.5};

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function screen(p){return{x:p.x*W,y:p.y*H}}
function px(r){return{x1:r.x1*W,y1:r.y1*H,x2:r.x2*W,y2:r.y2*H}}
function pointLine(p,a,b){
const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;
if(!l)return dist(p,a);
const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/l,0,1);
return dist(p,{x:a.x+t*dx,y:a.y+t*dy});
}
function intersect(a,b){
const den=(a.x1-a.x2)*(b.y1-b.y2)-(a.y1-a.y2)*(b.x1-b.x2);
if(Math.abs(den)<.001)return null;
const t=((a.x1-b.x1)*(b.y1-b.y2)-(a.y1-b.y1)*(b.x1-b.x2))/den;
const u=-((a.x1-a.x2)*(a.y1-b.y1)-(a.y1-a.y2)*(a.x1-b.x1))/den;
if(t<-.0001||t>1.0001||u<-.0001||u>1.0001)return null;
return{x:a.x1+t*(a.x2-a.x1),y:a.y1+t*(a.y2-a.y1),t,u};
}

function resize(){
const r=canvas.getBoundingClientRect();
W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);
canvas.width=W*D;canvas.height=H*D;
ctx.setTransform(D,0,0,D,0,0);
buildGraph();
}

function reset(){
roads=[
{x1:.055,y1:.5,x2:.30,y2:.5},
{x1:.70,y1:.5,x2:.945,y2:.5}
];
cost=0;spawn=0;cars=[];
buildGraph();
setMode("build");
$("notice").textContent="道路が分断されています。道路を建設して START と GOAL を接続しよう。";
}

function buildGraph(){
nodes=[];edges=[];
if(!W||!H)return;
const ss=roads.map(px);
const cuts=ss.map(s=>[
{t:0,x:s.x1,y:s.y1},
{t:1,x:s.x2,y:s.y2}
]);

function addCut(i,t,p){cuts[i].push({t,x:p.x,y:p.y})}

for(let i=0;i<ss.length;i++){
for(let j=i+1;j<ss.length;j++){
const a=ss[i],b=ss[j],hit=intersect(a,b);
if(hit){
addCut(i,hit.t,hit);addCut(j,hit.u,hit);
continue;
}
const endsA=[{x:a.x1,y:a.y1,t:0},{x:a.x2,y:a.y2,t:1}];
const endsB=[{x:b.x1,y:b.y1,t:0},{x:b.x2,y:b.y2,t:1}];
for(const p of endsA){
if(pointLine(p,{x:b.x1,y:b.y1},{x:b.x2,y:b.y2})<10){
const dx=b.x2-b.x1,dy=b.y2-b.y1,l=dx*dx+dy*dy;
if(l){
const t=clamp(((p.x-b.x1)*dx+(p.y-b.y1)*dy)/l,0,1);
const q={x:b.x1+t*dx,y:b.y1+t*dy};
addCut(i,p.t,q);addCut(j,t,q);
}
}
}
for(const p of endsB){
if(pointLine(p,{x:a.x1,y:a.y1},{x:a.x2,y:a.y2})<10){
const dx=a.x2-a.x1,dy=a.y2-a.y1,l=dx*dx+dy*dy;
if(l){
const t=clamp(((p.x-a.x1)*dx+(p.y-a.y1)*dy)/l,0,1);
const q={x:a.x1+t*dx,y:a.y1+t*dy};
addCut(j,p.t,q);addCut(i,t,q);
}
}
}
}
}

function nodeAt(p){
let n=nodes.find(v=>dist(v,p)<5);
if(!n){n={x:p.x,y:p.y,links:[]};nodes.push(n)}
return n;
}
for(let i=0;i<ss.length;i++){
const list=cuts[i].sort((a,b)=>a.t-b.t),clean=[];
for(const p of list){
if(!clean.length||Math.abs(p.t-clean[clean.length-1].t)>.0005)clean.push(p);
}
for(let k=0;k<clean.length-1;k++){
const a=nodeAt(clean[k]),b=nodeAt(clean[k+1]);
if(a===b||dist(a,b)<8)continue;
if(edges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)))continue;
const e={a,b,length:dist(a,b)};
edges.push(e);
a.links.push({node:b,edge:e});
b.links.push({node:a,edge:e});
}
}
}

function nearestPoint(p){
let best=null,bd=18;
for(const n of nodes){
const d=dist(p,n);
if(d<bd){best=n;bd=d}
}
if(best)return{x:best.x,y:best.y};
for(const r of roads){
const s=px(r);
if(pointLine(p,{x:s.x1,y:s.y1},{x:s.x2,y:s.y2})<13){
const dx=s.x2-s.x1,dy=s.y2-s.y1,l=dx*dx+dy*dy;
if(l){
const t=clamp(((p.x-s.x1)*dx+(p.y-s.y1)*dy)/l,0,1);
return{x:s.x1+t*dx,y:s.y1+t*dy};
}
}
}
return p;
}
function nearestNode(p){
let best=null,bd=20;
for(const n of nodes){const d=dist(p,n);if(d<bd){best=n;bd=d}}
return best;
}

function findRoute(){
const a=nearestNode(screen(START)),b=nearestNode(screen(GOAL));
if(!a||!b)return [];
const open=[a],prev=new Map(),score=new Map([[a,0]]),closed=new Set();
while(open.length){
open.sort((x,y)=>score.get(x)-score.get(y));
const n=open.shift();
if(closed.has(n))continue;
closed.add(n);
if(n===b)break;
for(const l of n.links){
const traffic=cars.filter(c=>c.path[c.i]?.edge===l.edge).length;
const s=score.get(n)+l.edge.length*(1+traffic*.7);
if(s<(score.get(l.node)??Infinity)){
score.set(l.node,s);prev.set(l.node,{n,edge:l.edge});open.push(l.node);
}
}
}
if(!score.has(b))return [];
const path=[];let n=b;
while(n!==a){
const p=prev.get(n);if(!p)return [];
path.unshift({from:p.n,to:n,edge:p.edge});n=p.n;
}
return path;
}

function spawnCar(){
const path=findRoute();
if(!path.length)return;
cars.push({path,i:0,t:0,speed:24+Math.random()*5,color:["#f5f7fa","#a8d6f5","#e9d5bf","#c7dfd0"][Math.floor(Math.random()*4)]});
}

function setMode(m){
mode=m;
$("build").classList.toggle("active",m==="build");
$("normal").classList.toggle("active",m==="normal");
$("notice").textContent=m==="build"
?"道路の始点から終点までドラッグ。既存道路に接続すると交差点になる。"
:"車は接続済みの道路を自動走行中。道路を追加するには「道路を建設」を押す。";
}
$("build").onclick=()=>setMode("build");
$("normal").onclick=()=>setMode("normal");
$("reset").onclick=reset;

function pointer(e){
const r=canvas.getBoundingClientRect();
return{x:e.clientX-r.left,y:e.clientY-r.top};
}
canvas.addEventListener("pointerdown",e=>{
if(mode!=="build")return;
drawing=true;p0=nearestPoint(pointer(e));p1=pointer(e);
canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{if(drawing)p1=pointer(e)});
canvas.addEventListener("pointerup",e=>{
if(!drawing)return;
drawing=false;
const a=p0,b=nearestPoint(pointer(e));
if(a&&b&&dist(a,b)>45){
roads.push({x1:clamp(a.x/W,0,1),y1:clamp(a.y/H,0,1),x2:clamp(b.x/W,0,1),y2:clamp(b.y/H,0,1)});
cost+=Math.round(dist(a,b)*.4);
buildGraph();
const old=cars.length;
cars=[];
if(nearestNode(screen(START))&&nearestNode(screen(GOAL))){
for(let i=0;i<Math.max(5,old);i++)spawnCar();
}
}
p0=null;p1=null;
});

function carPosition(c){
const s=c.path[c.i];if(!s)return null;
return{x:s.from.x+(s.to.x-s.from.x)*c.t,y:s.from.y+(s.to.y-s.from.y)*c.t};
}
function update(dt){
spawn+=dt;
if(spawn>=3.5&&cars.length<10){spawn=0;spawnCar()}
for(const c of cars){
const s=c.path[c.i];if(!s)continue;
let gap=Infinity;
for(const other of cars){
if(other===c)continue;
const os=other.path[other.i];
if(!os||os.edge!==s.edge)continue;
const ahead=other.t-c.t;
if(ahead>0&&ahead<gap)gap=ahead;
}
let velocity=c.speed;
if(gap<.12)velocity=0;
else if(gap<.22)velocity*=.35;
c.t+=velocity*dt/Math.max(1,s.edge.length);
if(c.t>=1){c.i++;c.t=0}
}
cars=cars.filter(c=>c.i<c.path.length);
}

function edgeLoad(e){return cars.filter(c=>c.path[c.i]?.edge===e).length}
function colorFor(e){
const n=edgeLoad(e);
return n>=3?"#ed4d4d":n>=2?"#f2a13b":"#697783";
}
function line(a,b,color,width){
ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();
}
function drawRoads(){
for(const e of edges)line(e.a,e.b,"#101820",35);
for(const e of edges)line(e.a,e.b,"#303a44",29);
for(const e of edges)line(e.a,e.b,colorFor(e),24);
for(const e of edges){
ctx.save();ctx.setLineDash([10,12]);
line(e.a,e.b,"#d9e0e6",1.3);
ctx.restore();
}
}
function drawCar(c){
const s=c.path[c.i];if(!s)return;
const a=s.from,b=s.to,pos=carPosition(c);
const angle=Math.atan2(b.y-a.y,b.x-a.x);
ctx.save();ctx.translate(pos.x,pos.y);ctx.rotate(angle);
ctx.fillStyle=c.color;ctx.strokeStyle="#18212a";ctx.lineWidth=1;
ctx.beginPath();ctx.roundRect(-8,-4,16,8,2.5);ctx.fill();ctx.stroke();
ctx.fillStyle="#76a8c4";ctx.beginPath();ctx.roundRect(-3,-2.8,7,5.6,1);ctx.fill();
ctx.fillStyle="#fff0b5";ctx.fillRect(6,-2.5,1.5,1.5);ctx.fillRect(6,1,1.5,1.5);
ctx.fillStyle="#d45d58";ctx.fillRect(-8,-2.5,1.5,1.5);ctx.fillRect(-8,1,1.5,1.5);
ctx.restore();
}
function marker(p,label,color){
const s=screen(p);
ctx.fillStyle=color;ctx.beginPath();ctx.arc(s.x,s.y,13,0,Math.PI*2);ctx.fill();
ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle="#fff";ctx.font="bold 13px Arial";ctx.textAlign="center";
ctx.fillText(label,s.x,s.y-23);
}
function draw(){
ctx.clearRect(0,0,W,H);
ctx.fillStyle="#202b34";ctx.fillRect(0,0,W,H);
ctx.strokeStyle="#2c3741";ctx.lineWidth=1;
for(let x=0;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
drawRoads();
for(const n of nodes){
if(n.links.length<3)continue;
ctx.beginPath();ctx.arc(n.x,n.y,12,0,Math.PI*2);
ctx.fillStyle="#303a44";ctx.fill();
}
for(const c of cars)drawCar(c);
marker(START,"START","#218ce0");
marker(GOAL,"GOAL","#25ad72");
if(drawing&&p0&&p1)line(p0,p1,"#b9e7ff",5);
$("count").textContent=cars.length;
$("cost").textContent=cost;
$("traffic").textContent=edges.filter(e=>edgeLoad(e)>=2).length;
let sum=0;
for(const c of cars){
const s=c.path[c.i];if(s)sum+=Math.max(0,c.speed-(edgeLoad(s.edge)-1)*6);
}
$("speed").textContent=cars.length?Math.round(sum/cars.length):0;
}
function frame(t){
if(!last)last=t;
const dt=Math.min((t-last)/1000,.035);
last=t;update(dt);draw();requestAnimationFrame(frame);
}
reset();
resize();
window.addEventListener("resize",resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
