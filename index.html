<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>交通フロー</title>
<style>
:root{--bg:#e6e1d3;--ink:#23272b;--mut:#6d6a60;--ac:#c9482a;--pn:#f4f1e8;--ln:#cbc4b1;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121514;--ink:#e9e6dc;--mut:#8f8c82;--ac:#e8794f;--pn:#1e2221;--ln:#363b39}}
html,body{height:100%;margin:0;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
#hud{display:flex;justify-content:space-between;padding:8px 14px 0;font-size:12px;color:var(--mut);white-space:nowrap}
#hud b{color:var(--ink);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:3px}
#msg{padding:2px 14px 0;height:18px;font-size:12px;color:var(--ac)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
canvas{display:block;border-radius:6px;touch-action:none}
#bar{display:flex;gap:6px;padding:8px 8px 10px}
button{flex:1;height:38px;padding:0;border:1px solid var(--ln);background:var(--pn);color:var(--ink);border-radius:6px;font:inherit;font-size:13px}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:active{opacity:.7}
</style>
</head>
<body>
<div id="hud">
<span>到着<b id="arrived">0</b></span>
<span>渋滞<b id="jam">0</b></span>
<span>予算 ¥<b id="money">0</b></span>
<span>交通量<b id="lvl">×1.0</b></span>
</div>
<div id="msg"></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar">
<button id="straight" class="on">直線</button>
<button id="free">自由</button>
<button id="repair">補修</button>
<button id="undo">戻す</button>
<button id="reset">リセット</button>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$("c"),ctx=cv.getContext("2d");
const portrait=innerHeight>innerWidth*1.05;
const W=portrait?600:1000,H=portrait?900:600;
const START=portrait?{x:300,y:90}:{x:70,y:300};
const GOAL=portrait?{x:300,y:810}:{x:930,y:300};
const dark=matchMedia("(prefers-color-scheme:dark)").matches;
const P=dark
?{ground:"#2a3a27",g1:"#2c3d29",g2:"#233221",sp:["#1f2d1d","#35482f"],tree1:"#1b2e1b",tree2:"#2d4a2b",sand:"#5b5742",w1:"#2f5f75",w2:"#14323f",mt1:"#59574f",mt2:"#35342f",snow:"#b9c4c8",rock1:"#5c5a54",rock2:"#33322e",road:"#4d5356",casing:"#6a665a",mark:"#cfc9b4",j1:"#b57e32",j2:"#b5453a",ink:"#e9e6dc"}
:{ground:"#93ad68",g1:"#9bb56f",g2:"#86a05d",sp:["#7f9a55","#aac07a"],tree1:"#3f6b3a",tree2:"#5d8c48",sand:"#cdbf94",w1:"#6fb0c9",w2:"#2f7391",mt1:"#a19c8f",mt2:"#6f6b61",snow:"#f2f5f7",rock1:"#aaa498",rock2:"#6b675e",road:"#4b5054",casing:"#a79f86",mark:"#e8e4d2",j1:"#d08d37",j2:"#cc4a3d",ink:"#23272b"};
const TYPES=[
{k:"c",len:16,w:9,v:[85,115],cols:["#d9552b","#2f6fa3","#e0b43c","#f2efe6","#3f8f5f","#8a5ba8"]},
{k:"t",len:27,w:10,v:[50,65],cols:["#e9e4d4","#8794a3"]},
{k:"s",len:15,w:8,v:[125,155],cols:["#c0392b","#f0c419"]}
];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
let roads=[],cars=[],nodes=[],edges=[],mode="straight";
let firstPoint=null,stroke=[],drawing=false,dragging=false,hover=null;
let lastTime=0,spawnTimer=0,arrived=0,connected=false,clock=0,money=3000,scale=1,evT=14,rush=0,demand=0,rainT=0,rainI=0,seed=1;
let mid={x:500,y:180},obstacles=[],bg=null;
const drops=Array.from({length:170},()=>({x:Math.random()*W,y:Math.random()*H,s:520+Math.random()*320}));

let lastTap=0;
document.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTap<320)e.preventDefault();
  lastTap=now;
},{passive:false});

function say(t){$("msg").textContent=t}
function randomMid(){
  if(portrait){
    mid={x:110+Math.random()*380,y:260+Math.random()*380};
    if(Math.abs(mid.x-300)<100)mid.x+=mid.x<300?-100:100;
    mid.x=clamp(mid.x,70,530);
  }else{
    mid={x:260+Math.random()*480,y:90+Math.random()*420};
    if(Math.abs(mid.y-300)<100)mid.y+=mid.y<300?-100:100;
    mid.y=clamp(mid.y,60,540);
  }
}
function shut(e){return !!(e.block||e.closed)}
function makeObstacles(){
  obstacles=[];
  seed=Math.floor(Math.random()*1e9);
  const k=portrait?.75:1;
  const n=portrait?5:6;
  let tries=0;
  while(obstacles.length<n&&tries<300){
    tries++;
    const q=Math.random();
    const kind=obstacles.length===0?"lake":q<.4?"lake":q<.75?"mtn":"rock";
    const r=(kind==="lake"?34+Math.random()*34:kind==="mtn"?40+Math.random()*30:16+Math.random()*12)*k;
    const o={type:kind,x:90+Math.random()*(W-180),y:90+Math.random()*(H-180),r,fl:0};
    let ok=true;
    for(const m of [START,GOAL,mid])if(dist(o,m)<r+70)ok=false;
    for(const b of obstacles)if(dist(o,b)<r+b.r+26)ok=false;
    if(ok)obstacles.push(o);
  }
}
function inObstacle(p){
  for(const o of obstacles)if(dist(p,o)<o.r+12)return true;
  return false;
}
function pathBlocked(pts){
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    const n=Math.max(1,Math.ceil(dist(a,b)/6));
    for(let j=0;j<=n;j++)if(inObstacle({x:lerp(a.x,b.x,j/n),y:lerp(a.y,b.y,j/n)}))return true;
  }
  return false;
}
function rng(s){
  return()=>{
    s|=0;s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function farFromAll(x,y,pad){
  for(const m of [START,GOAL,mid])if(Math.hypot(x-m.x,y-m.y)<pad)return false;
  for(const o of obstacles)if(Math.hypot(x-o.x,y-o.y)<o.r+pad*.5)return false;
  return true;
}
function drawMountain(g,o){
  const r=o.r;
  g.fillStyle="rgba(0,0,0,.2)";
  g.beginPath();g.ellipse(o.x+r*.1,o.y+r*.62,r*1.05,r*.22,0,0,Math.PI*2);g.fill();
  for(const p of [[-.45,-.45,.55],[.75,-.3,.45],[.2,-.95,.85]]){
    const ax=o.x+p[0]*r,ay=o.y+p[1]*r,w=p[2]*r,by=o.y+r*.6;
    g.fillStyle=P.mt1;
    g.beginPath();g.moveTo(ax,ay);g.lineTo(ax-w,by);g.lineTo(ax+w*.1,by);g.closePath();g.fill();
    g.fillStyle=P.mt2;
    g.beginPath();g.moveTo(ax,ay);g.lineTo(ax+w*.1,by);g.lineTo(ax+w,by);g.closePath();g.fill();
    const sh=(by-ay)*.28;
    g.fillStyle=P.snow;
    g.beginPath();g.moveTo(ax,ay);g.lineTo(ax-w*.28,ay+sh);g.lineTo(ax-w*.12,ay+sh*.7);g.lineTo(ax+w*.02,ay+sh*1.05);g.lineTo(ax+w*.16,ay+sh*.75);g.lineTo(ax+w*.28,ay+sh);g.closePath();g.fill();
  }
}
function drawRock(g,o){
  const r=o.r;
  for(const b of [[0,0,.8],[.62,.3,.5],[-.5,.4,.45]]){
    const x=o.x+b[0]*r,y=o.y+b[1]*r,s=b[2]*r;
    g.fillStyle="rgba(0,0,0,.22)";
    g.beginPath();g.ellipse(x+s*.2,y+s*.7,s*1.05,s*.38,0,0,Math.PI*2);g.fill();
    const gr=g.createRadialGradient(x-s*.35,y-s*.4,s*.1,x,y,s*1.05);
    gr.addColorStop(0,P.rock1);gr.addColorStop(1,P.rock2);
    g.fillStyle=gr;
    g.beginPath();g.ellipse(x,y,s,s*.82,0,0,Math.PI*2);g.fill();
  }
}
function drawTree(g,x,y,s){
  g.fillStyle="rgba(0,0,0,.2)";
  g.beginPath();g.ellipse(x+s*.35,y+s*.55,s*.95,s*.4,0,0,Math.PI*2);g.fill();
  for(const b of [[-.45,.25,.7],[.45,.2,.75],[0,0,1]]){
    const gr=g.createRadialGradient(x+b[0]*s-s*.25,y+b[1]*s-s*.3,s*.1,x+b[0]*s,y+b[1]*s,s*b[2]);
    gr.addColorStop(0,P.tree2);gr.addColorStop(1,P.tree1);
    g.fillStyle=gr;
    g.beginPath();g.arc(x+b[0]*s,y+b[1]*s,s*b[2],0,Math.PI*2);g.fill();
  }
}
function buildBg(){
  bg=document.createElement("canvas");
  bg.width=cv.width;bg.height=cv.height;
  const g=bg.getContext("2d");
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  const R=rng(seed);
  const grad=g.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,P.g1);grad.addColorStop(1,P.g2);
  g.fillStyle=grad;g.fillRect(0,0,W,H);
  for(let i=0;i<30;i++){
    const x=R()*W,y=R()*H,r=40+R()*90;
    const pg=g.createRadialGradient(x,y,0,x,y,r);
    pg.addColorStop(0,i%2?"rgba(255,255,200,.10)":"rgba(0,40,0,.12)");
    pg.addColorStop(1,"rgba(0,0,0,0)");
    g.fillStyle=pg;g.fillRect(x-r,y-r,r*2,r*2);
  }
  g.globalAlpha=.35;
  for(let i=0;i<2200;i++){
    g.fillStyle=P.sp[i%2];
    g.fillRect(R()*W,R()*H,1.6,2.4);
  }
  g.globalAlpha=1;
  for(const o of obstacles){
    if(o.type==="mtn")drawMountain(g,o);
    else if(o.type==="rock")drawRock(g,o);
  }
  let placed=0,tries=0;
  while(placed<70&&tries<400){
    tries++;
    const x=R()*W,y=R()*H,s=6+R()*7;
    if(!farFromAll(x,y,s+60))continue;
    drawTree(g,x,y,s);
    placed++;
  }
}
function fit(){
  const r=$("stage").getBoundingClientRect();
  scale=Math.min((r.width-16)/W,r.height/H);
  if(!(scale>0))return;
  const d=window.devicePixelRatio||1;
  cv.style.width=W*scale+"px";
  cv.style.height=H*scale+"px";
  cv.width=Math.round(W*scale*d);
  cv.height=Math.round(H*scale*d);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  buildBg();
  draw();
}
function screenPoint(e){
  const r=cv.getBoundingClientRect();
  return {x:clamp((e.clientX-r.left)*W/r.width,0,W),y:clamp((e.clientY-r.top)*H/r.height,0,H)};
}
function pointSegment(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const len=dx*dx+dy*dy;
  const t=len?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/len,0,1):0;
  const q={x:a.x+dx*t,y:a.y+dy*t};
  return {point:q,t,d:dist(p,q)};
}
function intersection(a,b,c,d){
  const den=(a.x-b.x)*(c.y-d.y)-(a.y-b.y)*(c.x-d.x);
  if(Math.abs(den)<0.0001)return null;
  const t=((a.x-c.x)*(c.y-d.y)-(a.y-c.y)*(c.x-d.x))/den;
  const u=-((a.x-b.x)*(a.y-c.y)-(a.y-b.y)*(a.x-c.x))/den;
  if(t<0.001||t>0.999||u<0.001||u>0.999)return null;
  return {x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y),t,u};
}
function snapPoint(p){
  let best=p,bestD=22;
  for(const m of [START,GOAL,mid]){
    const d=dist(p,m);
    if(d<bestD){bestD=d;best=m}
  }
  for(const n of nodes){
    const d=dist(p,n);
    if(d<bestD){bestD=d;best=n}
  }
  for(const road of roads){
    for(let i=0;i<road.length-1;i++){
      const q=pointSegment(p,road[i],road[i+1]);
      if(q.d<bestD){bestD=q.d;best=q.point}
    }
  }
  return {x:best.x,y:best.y};
}
function roadLength(pts){
  let s=0;
  for(let i=1;i<pts.length;i++)s+=dist(pts[i-1],pts[i]);
  return s;
}
function addRoad(points){
  if(points.length<2)return;
  const cleaned=[points[0]];
  for(let i=1;i<points.length;i++){
    if(dist(cleaned[cleaned.length-1],points[i])>5)cleaned.push(points[i]);
  }
  if(cleaned.length<2)return;
  cleaned[0]=snapPoint(cleaned[0]);
  cleaned[cleaned.length-1]=snapPoint(cleaned[cleaned.length-1]);
  if(pathBlocked(cleaned)){say("障害物があって通せません");return}
  const cost=roadLength(cleaned);
  if(cost>money){say("予算が足りません");return}
  money-=cost;
  cleaned.cost=cost;
  cleaned.wear=0;
  cleaned.repair=0;
  cleaned.warned=false;
  roads.push(cleaned);
  cars=[];
  rebuildGraph();
}
function smoothStroke(points){
  if(points.length<3)return points;
  const spaced=[points[0]];
  for(let i=1;i<points.length;i++){
    const a=spaced[spaced.length-1],b=points[i];
    const count=Math.ceil(dist(a,b)/5);
    for(let j=1;j<=count;j++){
      const t=j/count;
      spaced.push({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)});
    }
  }
  let sm=spaced;
  for(let pass=0;pass<2;pass++){
    const out=[sm[0]];
    for(let i=1;i<sm.length-1;i++){
      out.push({x:sm[i-1].x*.25+sm[i].x*.5+sm[i+1].x*.25,y:sm[i-1].y*.25+sm[i].y*.5+sm[i+1].y*.25});
    }
    out.push(sm[sm.length-1]);
    sm=out;
  }
  const simp=[sm[0]];
  let anchor=sm[0];
  for(let i=1;i<sm.length-1;i++){
    if(pointSegment(sm[i],anchor,sm[i+1]).d>1.8){simp.push(sm[i]);anchor=sm[i]}
  }
  simp.push(sm[sm.length-1]);
  return simp;
}

function goalPath(from){
  const g=closestNode(GOAL,40);
  return g?shortestPath(from,g):null;
}
function rerouteAll(){
  for(const c of cars){
    let hit=false;
    for(let i=c.index+1;i<c.path.length;i++)if(shut(c.path[i].edge))hit=true;
    if(!hit)continue;
    const alt=goalPath(c.path[c.index].to);
    if(alt&&!alt.some(s=>shut(s.edge)))c.path=c.path.slice(0,c.index+1).concat(alt);
  }
}
function startEvent(){
  const r=Math.random();
  if(r<.15){rush=8;say("ラッシュアワー！車が一気に押し寄せる");return}
  if(r<.23){money+=400;say("補助金が出た ¥+400");return}
  if(r<.43){rainT=28+Math.random()*14;say("大雨！湖が増水して道路が冠水するかも");return}
  const pool=edges.filter(e=>e.length>50&&!e.block);
  if(!pool.length)return;
  const busy=pool.filter(e=>e.cars>0);
  const list=busy.length?busy:pool;
  const e=list[Math.floor(Math.random()*list.length)];
  const x=(e.a.x+e.b.x)/2,y=(e.a.y+e.b.y)/2;
  if(r<.72){
    e.block={kind:"a",left:12,x,y};
    cars=cars.filter(c=>{const s=c.path[c.index];return !(s&&s.edge===e&&Math.abs(c.t-.5)<.25)});
    say("事故発生！タップで撤去(¥60)。放置でも12秒で片付きます");
  }else{
    e.block={kind:"r",left:Infinity,x,y};
    say("落石で通行止め！タップで撤去(¥120)");
  }
  rerouteAll();
}
function tickEvents(dt){
  tickWeather(dt);
  if(rush>0)rush-=dt;
  for(const e of edges){
    if(!e.block)continue;
    e.block.left-=dt;
    if(e.block.left<=0){e.block=null;say("通行再開")}
  }
  evT-=dt;
  if(evT<=0){
    evT=Math.max(7,16-Math.floor(arrived/6)*1.5)+Math.random()*8;
    startEvent();
  }
}
function floodAt(e){
  for(const o of obstacles){
    if(o.type!=="lake"||o.fl<8)continue;
    if(pointSegment(o,e.a,e.b).d<o.r+o.fl)return true;
  }
  return false;
}
function tickWeather(dt){
  if(rainT>0){
    rainT-=dt;
    rainI=Math.min(1,rainI+dt*.4);
    if(rainT<=0)say("雨があがった。水が引くまで待とう");
  }else rainI=Math.max(0,rainI-dt*.25);
  for(const o of obstacles){
    if(o.type!=="lake")continue;
    if(rainI>.5)o.fl=Math.min(70,o.fl+dt*3.4*rainI);
    else o.fl=Math.max(0,o.fl-dt*2.4);
  }
}
function tickRoads(dt){
  const jam=edges.filter(e=>e.slow>=2).length;
  if(jam<2)demand+=dt*.014;
  else demand=Math.max(0,demand-dt*.03);
  const toDestroy=[];
  for(const r of roads){
    if(r.repair>0){
      r.repair-=dt;
      if(r.repair<=0){r.wear=0;r.warned=false;say("補修完了。通行再開")}
    }else{
      r.wear=Math.min(100,r.wear+.1*dt);
      if(r.wear>=100)toDestroy.push(r);
    }
  }
  let closedNow=false;
  for(const e of edges){
    const r=e.road;
    if(r.repair<=0)r.wear=Math.min(100,r.wear+e.cars*.12*dt);
    const was=e.closed;
    e.flood=floodAt(e);
    e.closed=r.repair>0||r.wear>=100||e.flood;
    if(e.closed&&!was){
      closedNow=true;
      if(e.flood)say("洪水！道路が冠水しました。水が引くまで迂回を");
      else if(r.repair<=0&&r.wear<100)say("道路が崩壊！補修が必要です");
    }
  }
  if(toDestroy.length){
    for(const r of toDestroy){
      const idx=roads.indexOf(r);
      if(idx>=0){
        roads.splice(idx,1);
        say("道路が完全に破壊された！");
        closedNow=true;
      }
    }
  }
  if(closedNow){
    cars=[];
    rebuildGraph();
  }
  for(const r of roads){
    if(!r.warned&&r.wear>=70&&r.wear<100){r.warned=true;say("道が傷んできた。補修か迂回路を！")}
  }
}
function repairAt(p){
  let best=null,bd=26;
  for(const r of roads){
    for(let i=0;i<r.length-1;i++){
      const q=pointSegment(p,r[i],r[i+1]);
      if(q.d<bd){bd=q.d;best=r}
    }
  }
  if(!best)return false;
  if(best.repair>0){say("補修中です");return true}
  if(best.wear<15){say("まだ傷んでいません");return true}
  const cost=Math.round(Math.max(80,best.cost*.4));
  if(money<cost){say("補修の予算が足りません");return true}
  money-=cost;
  best.repair=8;
  say("補修工事中。8秒間は通行止めです");
  return true;
}
function clearBlock(p){
  for(const e of edges){
    const b=e.block;
    if(!b||dist(p,b)>34)continue;
    const cost=b.kind==="a"?60:120;
    if(money<cost){say("撤去する予算が足りません");return true}
    money-=cost;e.block=null;say("撤去完了");return true;
  }
  return false;
}

function rebuildGraph(){
  nodes=[];edges=[];
  const segments=[];
  for(let ri=0;ri<roads.length;ri++){
    const r=roads[ri];
    for(let i=0;i<r.length-1;i++){
      if(dist(r[i],r[i+1])>3)segments.push({a:r[i],b:r[i+1],cuts:[{t:0,p:r[i]},{t:1,p:r[i+1]}],ri,i});
    }
  }
  for(let i=0;i<segments.length;i++){
    for(let j=i+1;j<segments.length;j++){
      const a=segments[i],b=segments[j];
      if(a.ri===b.ri&&Math.abs(a.i-b.i)<=1)continue;
      const hit=intersection(a.a,a.b,b.a,b.b);
      if(hit){a.cuts.push({t:hit.t,p:hit});b.cuts.push({t:hit.u,p:hit})}
    }
  }
  for(let i=0;i<segments.length;i++){
    const a=segments[i];
    for(let j=0;j<segments.length;j++){
      if(i===j)continue;
      const b=segments[j];
      if(a.ri===b.ri&&Math.abs(a.i-b.i)<=1)continue;
      for(const end of [{t:0,p:a.a},{t:1,p:a.b}]){
        const q=pointSegment(end.p,b.a,b.b);
        if(q.d<15&&q.t>.02&&q.t<.98){
          a.cuts.push(end);
          b.cuts.push({t:q.t,p:end.p});
        }
      }
    }
  }
  function getNode(p){
    let n=nodes.find(v=>dist(v,p)<5);
    if(!n){n={x:p.x,y:p.y,id:nodes.length,links:[]};nodes.push(n)}
    return n;
  }
  for(const s of segments){
    s.cuts.sort((a,b)=>a.t-b.t);
    const uniq=[];
    for(const c of s.cuts){
      if(!uniq.length||Math.abs(c.t-uniq[uniq.length-1].t)>.002)uniq.push(c);
    }
    for(let i=0;i<uniq.length-1;i++){
      const a=getNode(uniq[i].p),b=getNode(uniq[i+1].p);
      if(a===b)continue;
      const length=dist(a,b);
      if(length<3)continue;
      const edge={a,b,length,cars:0,slow:0,road:roads[s.ri]};
      edges.push(edge);
      a.links.push({node:b,edge});
      b.links.push({node:a,edge});
    }
  }
  connected=!!routeForCar();
  spawnTimer=1.5;
  evT=14;
  say(connected?"運行開始。事故や落石が起きたらタップで撤去できます":"出発から寄り道を通ってゴールまでつなごう");
}
function closestNode(p,max=35){
  let best=null,d0=max;
  for(const n of nodes){
    const d=dist(n,p);
    if(d<d0){d0=d;best=n}
  }
  return best;
}
function shortestPath(from,to){
  if(!from||!to)return null;
  const costs=new Map([[from,0]]),prev=new Map(),open=[from],visited=new Set();
  while(open.length){
    open.sort((a,b)=>costs.get(a)-costs.get(b));
    const n=open.shift();
    if(visited.has(n))continue;
    visited.add(n);
    if(n===to)break;
    for(const link of n.links){
      const e=link.edge;
      const next=costs.get(n)+e.length*(1+(e.cars||0)*.45)+(shut(e)?3000:0);
      if(next<(costs.get(link.node)??Infinity)){
        costs.set(link.node,next);
        prev.set(link.node,{node:n,edge:e});
        open.push(link.node);
      }
    }
  }
  if(!costs.has(to))return null;
  const path=[];
  let n=to;
  while(n!==from){
    const p=prev.get(n);
    if(!p)return null;
    path.unshift({edge:p.edge,from:p.node,to:n});
    n=p.node;
  }
  return path;
}
function routeForCar(){
  const s=closestNode(START,40),g=closestNode(GOAL,40);
  if(!s||!g)return null;
  const full=shortestPath(s,g);
  if(!full)return null;
  const m=closestNode(mid,40);
  if(!m)return null;
  const a=shortestPath(s,m),b=shortestPath(m,g);
  return a&&b?[...a,...b]:null;
}

function edgeAng(s){return Math.atan2(s.to.y-s.from.y,s.to.x-s.from.x)}
function angDiff(a,b){
  let d=b-a;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  return d;
}
function spawnCar(){
  const route=routeForCar();
  if(!route||!route.length)return;
  if(route.some(s=>shut(s.edge)))return;
  const first=route[0];
  for(const o of cars){
    const s=o.path[o.index];
    if(s&&s.edge===first.edge&&s.from===first.from&&o.t*s.edge.length<36)return;
  }
  spawnTimer=0;
  const r=Math.random();
  const ty=r<.2?TYPES[1]:r<.36?TYPES[2]:TYPES[0];
  cars.push({path:route,index:0,t:0,v:0,ang:edgeAng(route[0]),len:ty.len,w:ty.w,type:ty.k,br:false,
    vmax:ty.v[0]+Math.random()*(ty.v[1]-ty.v[0]),
    col:ty.cols[Math.floor(Math.random()*ty.cols.length)]});
}
function gapAhead(c){
  const s=c.path[c.index],L=s.edge.length;
  const nx=c.path[c.index+1];
  let g=Infinity;
  for(const o of cars){
    if(o===c)continue;
    const os=o.path[o.index];
    if(!os)continue;
    const half=(o.len+c.len)/2+3;
    if(os.edge===s.edge&&os.from===s.from){
      if(o.t>c.t)g=Math.min(g,(o.t-c.t)*L-half);
    }else if(nx&&os.edge===nx.edge&&os.from===nx.from){
      g=Math.min(g,(1-c.t)*L+o.t*os.edge.length-half);
    }
  }
  return g;
}
function update(dt){
  clock+=dt;
  if(!connected)return;
  tickEvents(dt);
  spawnTimer+=dt;
  const lvl=demand;
  if(spawnTimer>=(rush>0?.35:Math.max(.45,2.6/(1+demand)))&&cars.length<(rush>0?45:Math.min(45,26+demand*6)))spawnCar();
  for(const e of edges){e.cars=0;e.slow=0}
  for(const c of cars){
    const s=c.path[c.index];
    if(s){s.edge.cars++;if(c.v<22)s.edge.slow++}
  }
  tickRoads(dt);
  for(const c of cars){
    const s=c.path[c.index],L=s.edge.length;
    let vt=c.vmax*(1+lvl*.03)*(1-Math.max(0,s.edge.road.wear-50)/110)*(1-.22*rainI);
    const toEnd=(1-c.t)*L;
    const nx=c.path[c.index+1];
    if(nx&&toEnd<45){
      const k=Math.min(1,Math.abs(angDiff(edgeAng(s),edgeAng(nx)))/1.3);
      vt*=1-.6*k;
    }
    let g=gapAhead(c);
    if(shut(s.edge)&&c.t<.5)g=Math.min(g,(.5-c.t)*L-16);
    vt=Math.min(vt,Math.sqrt(2*260*Math.max(0,g)));
    c.br=c.v>vt+6;
    if(c.v<vt)c.v=Math.min(vt,c.v+130*dt);
    else c.v=Math.max(vt,c.v-280*dt);
    c.t+=c.v*dt/L;
    c.ang+=angDiff(c.ang,edgeAng(s))*Math.min(1,dt*10);
    if(c.t>=1){
      c.t=0;
      c.index++;
      if(c.index>=c.path.length){c.done=true;arrived++;money+=45}
    }
  }
  cars=cars.filter(c=>!c.done);
}
function updateHud(){
  $("arrived").textContent=arrived;
  $("jam").textContent=edges.filter(e=>e.slow>=2).length;
  $("money").textContent=Math.round(money);
  $("lvl").textContent="×"+(1+demand).toFixed(1);
}

function drawGround(){
  if(bg)ctx.drawImage(bg,0,0,W,H);
  else{ctx.fillStyle=P.ground;ctx.fillRect(0,0,W,H)}
  for(const o of obstacles){
    if(o.type!=="lake")continue;
    const R=o.r+o.fl;
    ctx.fillStyle=P.sand;ctx.beginPath();ctx.arc(o.x,o.y,R+4,0,Math.PI*2);ctx.fill();
    const gr=ctx.createRadialGradient(o.x-R*.25,o.y-R*.25,R*.1,o.x,o.y,R);
    gr.addColorStop(0,P.w1);gr.addColorStop(1,P.w2);
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(o.x,o.y,R,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1.2;
    for(let i=0;i<4;i++){
      const a=clock*.6+i*1.7,rr=R*(.25+.15*i);
      ctx.beginPath();ctx.arc(o.x,o.y,rr,a,a+.9);ctx.stroke();
    }
  }
}
function drawCracks(e,intensity){
  const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y;
  const len=Math.hypot(dx,dy);
  if(len<8)return;
  const nx=-dy/len,ny=dx/len;
  const segs=Math.max(2,Math.floor(len/18*intensity));
  ctx.strokeStyle="#5a4030";
  ctx.lineWidth=1.4+intensity*1.2;
  ctx.globalAlpha=.35+intensity*.55;
  ctx.setLineDash([]);
  for(let i=0;i<segs;i++){
    const t0=(i+.15+Math.sin(i*2.7)*.08)/segs;
    const t1=Math.min(1,t0+.12+Math.random()*.08);
    const off=(Math.sin(i*3.1+e.a.x)*.6+Math.cos(i*1.7)*.4)*6*intensity;
    const x0=e.a.x+dx*t0+nx*off;
    const y0=e.a.y+dy*t0+ny*off;
    const x1=e.a.x+dx*t1+nx*(off+(Math.random()-.5)*4);
    const y1=e.a.y+dy*t1+ny*(off+(Math.random()-.5)*4);
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.lineTo(x1,y1);
    if(intensity>.6&&Math.random()>.4){
      const bx=x1+nx*(3+Math.random()*4)*(Math.random()>.5?1:-1);
      const by=y1+ny*(3+Math.random()*4)*(Math.random()>.5?1:-1);
      ctx.lineTo(bx,by);
    }
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawRoads(){
  ctx.lineCap="round";
  ctx.strokeStyle=P.casing;ctx.lineWidth=30;
  for(const e of edges){ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke()}
  ctx.strokeStyle=P.mark;ctx.lineWidth=26;
  for(const e of edges){ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke()}
  ctx.lineWidth=22;
  for(const e of edges){
    ctx.strokeStyle=e.closed&&!e.flood?"#6b4b34":e.slow>=3?P.j2:e.slow>=2?P.j1:P.road;
    ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();
  }
  ctx.fillStyle=P.road;
  for(const n of nodes){
    if(n.links.length>2){ctx.beginPath();ctx.arc(n.x,n.y,15,0,Math.PI*2);ctx.fill()}
  }
  ctx.lineCap="butt";
  ctx.strokeStyle=P.mark;ctx.globalAlpha=.5;ctx.lineWidth=1.3;ctx.setLineDash([9,9]);
  for(const e of edges){ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke()}
  ctx.setLineDash([]);ctx.globalAlpha=1;
  for(const e of edges){
    const w=e.road.wear;
    if(e.closed){
      ctx.strokeStyle="#e9b23a";ctx.lineWidth=20;ctx.globalAlpha=.7;ctx.setLineDash([7,9]);
      ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }else if(w>=20){
      const intensity=Math.min(1,(w-20)/80);
      drawCracks(e,intensity);
    }
  }
}
function drawFloods(){
  for(const o of obstacles){
    if(o.type!=="lake"||o.fl<1)continue;
    ctx.fillStyle="rgba(70,140,175,"+Math.min(.45,o.fl/25)+")";
    ctx.beginPath();ctx.arc(o.x,o.y,o.r+o.fl,0,Math.PI*2);ctx.fill();
  }
}
function drawWeather(){
  if(rainI<.02)return;
  ctx.fillStyle="rgba(12,22,40,"+(.3*rainI)+")";
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(205,225,255,.5)";ctx.lineWidth=1.2;
  ctx.beginPath();
  const n=Math.floor(drops.length*rainI);
  for(let i=0;i<n;i++){
    const d=drops[i];
    const y=(d.y+clock*d.s)%H;
    const x=(d.x+y*.22)%W;
    ctx.moveTo(x,y);ctx.lineTo(x-3,y+12);
  }
  ctx.stroke();
}
function drawBlocks(){
  for(const e of edges){
    const b=e.block;
    if(!b)continue;
    ctx.save();ctx.translate(b.x,b.y);
    if(b.kind==="a"){
      ctx.fillStyle="#9aa0a6";ctx.save();ctx.rotate(.5);ctx.fillRect(-12,-5,16,9);ctx.restore();
      ctx.fillStyle="#d9552b";ctx.save();ctx.rotate(-.7);ctx.fillRect(-4,-4,16,9);ctx.restore();
      if(Math.sin(clock*9)>0){ctx.fillStyle="#ff3b30";ctx.beginPath();ctx.arc(0,-1,4,0,Math.PI*2);ctx.fill()}
    }else{
      ctx.fillStyle="#7d7a72";
      for(const r of [[-7,2,8],[2,-3,9],[6,6,6],[-3,-7,6]]){ctx.beginPath();ctx.arc(r[0],r[1],r[2],0,Math.PI*2);ctx.fill()}
    }
    ctx.fillStyle=P.ground;ctx.fillRect(-34,-36,68,16);
    ctx.fillStyle=P.ink;ctx.font='bold 11px -apple-system,"Hiragino Sans",sans-serif';ctx.textAlign="center";
    ctx.fillText(b.kind==="a"?"事故 ¥60":"落石 ¥120",0,-24);
    ctx.restore();
  }
}
function drawWear(){
  ctx.font='bold 11px -apple-system,"Hiragino Sans",sans-serif';ctx.textAlign="center";
  for(const r of roads){
    if(!(mode==="repair"||r.wear>=40||r.repair>0))continue;
    const i=Math.floor((r.length-1)/2);
    const x=(r[i].x+r[i+1].x)/2,y=(r[i].y+r[i+1].y)/2;
    const txt=r.repair>0?"補修中 "+Math.ceil(r.repair)+"秒":"傷み "+Math.round(r.wear)+"%"+(mode==="repair"?" ¥"+Math.round(Math.max(80,r.cost*.4)):"");
    const tw=ctx.measureText(txt).width+10;
    ctx.fillStyle=P.ground;ctx.fillRect(x-tw/2,y-30,tw,16);
    ctx.fillStyle=r.wear>=70?"#d6453d":P.ink;
    ctx.fillText(txt,x,y-18);
  }
}
function drawMarker(p,label,color,diamond){
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle=color;ctx.strokeStyle=P.ground;ctx.lineWidth=3;
  ctx.beginPath();
  if(diamond){ctx.moveTo(0,-12);ctx.lineTo(12,0);ctx.lineTo(0,12);ctx.lineTo(-12,0);ctx.closePath()}
  else ctx.arc(0,0,11,0,Math.PI*2);
  ctx.stroke();ctx.fill();
  ctx.fillStyle=P.ink;ctx.font='bold 13px -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';ctx.textAlign="center";
  ctx.fillText(label,0,-19);
  ctx.restore();
}
function drawCar(c){
  const s=c.path[c.index];
  if(!s)return;
  const x=lerp(s.from.x,s.to.x,c.t),y=lerp(s.from.y,s.to.y,c.t);
  ctx.save();
  ctx.translate(x+Math.sin(c.ang)*5,y-Math.cos(c.ang)*5);
  ctx.rotate(c.ang);
  const l=c.len,w=c.w;
  if(rainI>.2){
    ctx.fillStyle="rgba(255,240,170,"+.14*rainI+")";
    ctx.beginPath();ctx.moveTo(c.len/2,-c.w/2+1);ctx.lineTo(c.len/2+30,-c.w/2-7);ctx.lineTo(c.len/2+30,c.w/2+7);ctx.lineTo(c.len/2,c.w/2-1);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.fillRect(-l/2+1.5,-w/2+2.5,l,w);
  ctx.fillStyle=c.col;ctx.fillRect(-l/2,-w/2,l,w);
  ctx.fillStyle="rgba(255,255,255,.22)";ctx.fillRect(-l/2,-w/2,l,2);
  ctx.fillStyle="rgba(0,0,0,.25)";ctx.fillRect(-l/2,w/2-2,l,2);
  ctx.fillStyle="#1c2a36";
  if(c.type==="t"){
    ctx.fillRect(l/2-8,-w/2+1.2,6,w-2.4);
    ctx.fillStyle="rgba(0,0,0,.18)";ctx.fillRect(-l/2+1,-w/2+1,l-11,w-2);
  }else{
    ctx.fillRect(-l*.02,-w/2+1.4,l*.24,w-2.8);
    ctx.fillRect(-l*.38,-w/2+1.6,l*.12,w-3.2);
    ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(-l*.26,-w/2+1.6,l*.24,w-3.2);
  }
  ctx.fillStyle=c.br?"#ff3b30":"#7a1f1a";
  ctx.fillRect(-l/2,-w/2+1,1.8,2);ctx.fillRect(-l/2,w/2-3,1.8,2);
  ctx.fillStyle="#fff6c8";
  ctx.fillRect(l/2-1.5,-w/2+1,1.5,2);ctx.fillRect(l/2-1.5,w/2-3,1.5,2);
  ctx.restore();
}
function draw(){
  drawGround();
  drawRoads();
  drawFloods();
  drawBlocks();
  for(const c of cars)drawCar(c);
  drawWear();
  drawMarker(START,"出発","#3f8f5f");
  drawMarker(mid,"寄り道","#d08d37",true);
  drawMarker(GOAL,"ゴール","#2f6fa3");
  drawWeather();
  if(mode==="straight"&&firstPoint){
    ctx.fillStyle=P.ink;ctx.beginPath();ctx.arc(firstPoint.x,firstPoint.y,5,0,Math.PI*2);ctx.fill();
    if(hover){
      const end=snapPoint(hover),cost=dist(firstPoint,end),bad=cost>money||pathBlocked([firstPoint,end]);
      ctx.strokeStyle=bad?"#d6453d":P.ink;ctx.lineWidth=3;ctx.setLineDash([6,6]);
      ctx.beginPath();ctx.moveTo(firstPoint.x,firstPoint.y);ctx.lineTo(end.x,end.y);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=bad?"#d6453d":P.ink;
      ctx.font='bold 13px -apple-system,Arial,sans-serif';ctx.textAlign="center";
      ctx.fillText("¥"+Math.round(cost),(firstPoint.x+end.x)/2,(firstPoint.y+end.y)/2-12);
    }
  }
  if(drawing&&stroke.length>1){
    ctx.strokeStyle=P.ink;ctx.lineWidth=3;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(stroke[0].x,stroke[0].y);
    for(let i=1;i<stroke.length;i++)ctx.lineTo(stroke[i].x,stroke[i].y);
    ctx.stroke();ctx.setLineDash([]);
  }
}

function commit(p){
  const end=snapPoint(p);
  if(dist(firstPoint,end)>12)addRoad([firstPoint,end]);
  firstPoint=null;
}
cv.addEventListener("pointerdown",e=>{
  const p=screenPoint(e);
  hover=p;
  if(clearBlock(p))return;
  if(mode==="repair"){repairAt(p);return}
  cv.setPointerCapture(e.pointerId);
  if(mode==="free"){drawing=true;stroke=[p];return}
  if(firstPoint){commit(p);return}
  firstPoint=snapPoint(p);
  dragging=true;
});
cv.addEventListener("pointermove",e=>{
  const p=screenPoint(e);
  hover=p;
  if(drawing&&dist(stroke[stroke.length-1],p)>3)stroke.push(p);
});
function finish(e){
  if(drawing){
    drawing=false;
    const result=smoothStroke(stroke);
    stroke=[];
    if(result.length>1)addRoad(result);
  }
  if(dragging&&firstPoint&&e&&e.type==="pointerup"){
    const p=screenPoint(e);
    if(dist(firstPoint,p)>25)commit(p);
  }
  dragging=false;
}
cv.addEventListener("pointerup",finish);
cv.addEventListener("pointercancel",finish);

function setMode(m){
  mode=m;firstPoint=null;
  for(const id of ["straight","free","repair"])$(id).classList.toggle("on",id===m);
}
$("straight").onclick=()=>setMode("straight");
$("free").onclick=()=>setMode("free");
$("repair").onclick=()=>setMode("repair");
$("undo").onclick=()=>{
  const r=roads.pop();
  if(r)money+=r.cost;
  cars=[];
  rebuildGraph();
};
$("reset").onclick=()=>{
  roads=[];cars=[];nodes=[];edges=[];
  arrived=0;money=3000;spawnTimer=0;rush=0;demand=0;rainT=0;rainI=0;
  firstPoint=null;stroke=[];drawing=false;
  randomMid();
  makeObstacles();
  buildBg();
  rebuildGraph();
};

function loop(t){
  const dt=Math.min((t-lastTime)/1000||0,.05);
  lastTime=t;
  update(dt);
  draw();
  updateHud();
  requestAnimationFrame(loop);
}
randomMid();
makeObstacles();
rebuildGraph();
fit();
new ResizeObserver(fit).observe($("stage"));
requestAnimationFrame(loop);
</script>
</body>
