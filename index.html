<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Traffic Flow</title>
<style>
body {
  margin: 0;
  background: #1a1a1a;
  color: #eee;
  font-family: sans-serif;
  overflow: hidden;
}
#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  background: rgba(0,0,0,0.7);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
}
#ui button {
  margin: 4px 4px 4px 0;
  padding: 6px 12px;
  cursor: pointer;
  border: none;
  border-radius: 4px;
  background: #444;
  color: #fff;
}
#ui button.active {
  background: #2a7;
}
#ui button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
#msg {
  margin-top: 8px;
  font-weight: bold;
}
canvas {
  display: block;
  background: #222;
  cursor: crosshair;
}
</style>
</head>
<body>
<div id="ui">
  <div>予算: <span id="budget">5000</span></div>
  <div>平均速度: <span id="avgSpeed">-</span></div>
  <div>クリアまで: <span id="clearTime">0</span>秒</div>
  <button id="btnRoad" class="active">道を描く</button>
  <button id="btnLight">信号を置く (300)</button>
  <button id="btnStart">開始</button>
  <button id="btnReset">リセット</button>
  <div id="msg"></div>
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const budgetEl = document.getElementById('budget');
const avgSpeedEl = document.getElementById('avgSpeed');
const clearTimeEl = document.getElementById('clearTime');
const msgEl = document.getElementById('msg');
const btnRoad = document.getElementById('btnRoad');
const btnLight = document.getElementById('btnLight');
const btnStart = document.getElementById('btnStart');
const btnReset = document.getElementById('btnReset');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let budget = 5000;
let mode = 'road';
let drawing = false;
let currentStroke = [];
let roads = [];
let nodes = [];
let edges = [];
let lights = [];
let cars = [];
let running = false;
let smoothTimer = 0;
let lastTime = 0;
const ROAD_COST_PER_PX = 0.8;
const LIGHT_COST = 300;
const NODE_MERGE_DIST = 18;
const CAR_SPAWN_INTERVAL = 1.2;
let spawnTimer = 0;
const MAX_CARS = 40;
const JAM_THRESHOLD = 3;
const SMOOTH_SPEED = 55;
const SMOOTH_NEEDED = 12;

btnRoad.onclick = () => {
  mode = 'road';
  btnRoad.classList.add('active');
  btnLight.classList.remove('active');
};
btnLight.onclick = () => {
  mode = 'light';
  btnLight.classList.add('active');
  btnRoad.classList.remove('active');
};
btnStart.onclick = () => {
  if (roads.length === 0) {
    msgEl.textContent = '道を先に描け';
    return;
  }
  buildGraph();
  running = true;
  msgEl.textContent = '走行中';
  btnStart.disabled = true;
};
btnReset.onclick = () => location.reload();

canvas.addEventListener('mousedown', e => {
  if (running) return;
  const p = getPos(e);
  if (mode === 'road') {
    drawing = true;
    currentStroke = [p];
  } else if (mode === 'light') {
    if (budget < LIGHT_COST) {
      msgEl.textContent = '予算不足';
      return;
    }
    lights.push({ x: p.x, y: p.y, green: true, timer: 0 });
    budget -= LIGHT_COST;
    updateBudget();
  }
});
canvas.addEventListener('mousemove', e => {
  if (!drawing || running) return;
  const p = getPos(e);
  const last = currentStroke[currentStroke.length - 1];
  if (dist(last, p) > 6) currentStroke.push(p);
});
canvas.addEventListener('mouseup', () => {
  if (!drawing || running) return;
  drawing = false;
  if (currentStroke.length < 2) return;
  let len = 0;
  for (let i = 1; i < currentStroke.length; i++) {
    len += dist(currentStroke[i - 1], currentStroke[i]);
  }
  const cost = Math.ceil(len * ROAD_COST_PER_PX);
  if (budget < cost) {
    msgEl.textContent = '予算不足（必要: ' + cost + '）';
    currentStroke = [];
    return;
  }
  budget -= cost;
  updateBudget();
  roads.push(currentStroke.slice());
  currentStroke = [];
  msgEl.textContent = '道を追加（消費: ' + cost + '）';
});
canvas.addEventListener('mouseleave', () => {
  if (drawing) {
    drawing = false;
    currentStroke = [];
  }
});

function getPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}
function updateBudget() {
  budgetEl.textContent = budget;
}

function buildGraph() {
  nodes = [];
  edges = [];
  const allPoints = [];
  roads.forEach((stroke, ri) => {
    stroke.forEach((p, pi) => {
      allPoints.push({ x: p.x, y: p.y, ri, pi });
    });
  });
  const used = new Array(allPoints.length).fill(false);
  for (let i = 0; i < allPoints.length; i++) {
    if (used[i]) continue;
    const group = [i];
    used[i] = true;
    for (let j = i + 1; j < allPoints.length; j++) {
      if (used[j]) continue;
      if (dist(allPoints[i], allPoints[j]) < NODE_MERGE_DIST) {
        group.push(j);
        used[j] = true;
      }
    }
    let sx = 0, sy = 0;
    group.forEach(g => {
      sx += allPoints[g].x;
      sy += allPoints[g].y;
    });
    nodes.push({
      x: sx / group.length,
      y: sy / group.length,
      id: nodes.length
    });
  }
  const pointToNode = new Array(allPoints.length);
  for (let i = 0; i < allPoints.length; i++) {
    let best = 0;
    let bestD = Infinity;
    for (let n = 0; n < nodes.length; n++) {
      const d = dist(allPoints[i], nodes[n]);
      if (d < bestD) {
        bestD = d;
        best = n;
      }
    }
    pointToNode[i] = best;
  }
  roads.forEach((stroke, ri) => {
    let prevNode = -1;
    stroke.forEach((p, pi) => {
      const idx = allPoints.findIndex(ap => ap.ri === ri && ap.pi === pi);
      const nid = pointToNode[idx];
      if (prevNode !== -1 && prevNode !== nid) {
        const a = Math.min(prevNode, nid);
        const b = Math.max(prevNode, nid);
        if (!edges.some(e => e.a === a && e.b === b)) {
          edges.push({
            a, b,
            length: dist(nodes[a], nodes[b]),
            cars: 0
          });
        }
      }
      prevNode = nid;
    });
  });
}

function dijkstra(start, end) {
  const N = nodes.length;
  const distArr = new Array(N).fill(Infinity);
  const prev = new Array(N).fill(-1);
  distArr[start] = 0;
  const pq = [{ id: start, d: 0 }];
  while (pq.length) {
    pq.sort((a, b) => a.d - b.d);
    const { id: u, d } = pq.shift();
    if (d > distArr[u]) continue;
    if (u === end) break;
    edges.forEach(e => {
      let v = -1;
      if (e.a === u) v = e.b;
      else if (e.b === u) v = e.a;
      if (v === -1) return;
      const lightSlow = lights.some(l => dist(l, nodes[v]) < 25 && !l.green) ? 40 : 0;
      const jamFactor = 1 + e.cars * 0.35;
      const cost = e.length * jamFactor + lightSlow;
      if (distArr[u] + cost < distArr[v]) {
        distArr[v] = distArr[u] + cost;
        prev[v] = u;
        pq.push({ id: v, d: distArr[v] });
      }
    });
  }
  if (distArr[end] === Infinity) return null;
  const path = [];
  let cur = end;
  while (cur !== -1) {
    path.push(cur);
    cur = prev[cur];
  }
  path.reverse();
  return path;
}

function spawnCar() {
  if (cars.length >= MAX_CARS || nodes.length < 2) return;
  const start = Math.floor(Math.random() * nodes.length);
  let end = Math.floor(Math.random() * nodes.length);
  while (end === start) end = Math.floor(Math.random() * nodes.length);
  const path = dijkstra(start, end);
  if (!path || path.length < 2) return;
  cars.push({
    path,
    idx: 0,
    t: 0,
    speed: 70,
    baseSpeed: 70 + Math.random() * 20
  });
}

function updateCars(dt) {
  edges.forEach(e => e.cars = 0);
  cars.forEach(car => {
    if (car.idx >= car.path.length - 1) return;
    const a = nodes[car.path[car.idx]];
    const b = nodes[car.path[car.idx + 1]];
    const edge = edges.find(e =>
      (e.a === car.path[car.idx] && e.b === car.path[car.idx + 1]) ||
      (e.b === car.path[car.idx] && e.a === car.path[car.idx + 1])
    );
    if (edge) edge.cars++;
    let spd = car.baseSpeed;
    if (edge && edge.cars > JAM_THRESHOLD) {
      spd *= Math.max(0.25, 1 - (edge.cars - JAM_THRESHOLD) * 0.18);
    }
    const light = lights.find(l => dist(l, b) < 28);
    if (light && !light.green) {
      spd = 0;
    }
    car.speed = spd;
    const len = dist(a, b);
    car.t += (spd * dt) / Math.max(len, 1);
    if (car.t >= 1) {
      car.t = 0;
      car.idx++;
    }
  });
  cars = cars.filter(c => c.idx < c.path.length - 1);
}

function updateLights(dt) {
  lights.forEach(l => {
    l.timer += dt;
    if (l.timer > 3.5) {
      l.timer = 0;
      l.green = !l.green;
    }
  });
}

function getCarPos(car) {
  if (car.idx >= car.path.length - 1) {
    return nodes[car.path[car.path.length - 1]];
  }
  const a = nodes[car.path[car.idx]];
  const b = nodes[car.path[car.idx + 1]];
  return {
    x: a.x + (b.x - a.x) * car.t,
    y: a.y + (b.y - a.y) * car.t
  };
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  roads.forEach(stroke => {
    ctx.beginPath();
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    stroke.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  });
  if (currentStroke.length > 1) {
    ctx.beginPath();
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 14;
    ctx.lineCap = 'round';
    currentStroke.forEach((p, i) => {
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    });
    ctx.stroke();
  }
  edges.forEach(e => {
    if (e.cars > JAM_THRESHOLD) {
      const a = nodes[e.a];
      const b = nodes[e.b];
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,80,80,0.5)';
      ctx.lineWidth = 16;
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  });
  lights.forEach(l => {
    ctx.beginPath();
    ctx.fillStyle = l.green ? '#2f8' : '#f44';
    ctx.arc(l.x, l.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
  cars.forEach(car => {
    const p = getCarPos(car);
    ctx.beginPath();
    ctx.fillStyle = car.speed < 20 ? '#f66' : '#4af';
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();
  });
}

function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  if (running) {
    spawnTimer += dt;
    if (spawnTimer > CAR_SPAWN_INTERVAL) {
      spawnTimer = 0;
      spawnCar();
    }
    updateLights(dt);
    updateCars(dt);
    let totalSpeed = 0;
    cars.forEach(c => totalSpeed += c.speed);
    const avg = cars.length ? totalSpeed / cars.length : 0;
    avgSpeedEl.textContent = avg.toFixed(1);
    if (avg >= SMOOTH_SPEED && cars.length >= 5) {
      smoothTimer += dt;
    } else {
      smoothTimer = Math.max(0, smoothTimer - dt * 0.5);
    }
    clearTimeEl.textContent = smoothTimer.toFixed(1);
    if (smoothTimer >= SMOOTH_NEEDED) {
      running = false;
      msgEl.textContent = 'クリア！渋滞を緩和できた';
      msgEl.style.color = '#2f8';
    }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
